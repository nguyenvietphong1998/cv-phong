name: Deploy CV len GitHub Pages

# Tu chay khi push len main, dong time chay tay duoc tu tab Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Chi mot lenh deploy chay mot luc, huy lenh cu khi co lenh moi
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - name: Lay ma nguon
        uses: actions/checkout@v4

      - name: Cai Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cai dependencies
        run: npm ci

      - name: Build (tsc + vite)
        run: npm run build

      - name: Cau hinh GitHub Pages
        uses: actions/configure-pages@v5
        with:
          # Tu bat GitHub Pages (nguon GitHub Actions) neu repo chua bat
          enablement: true

      - name: Tai file build (dist/)
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy len Pages
        id: pages
        uses: actions/deploy-pages@v4
